name: noaa_stage1_experiment_11_conservative_augmentation
program: modeling/experiment_11_noaa_stage1_conservative_augmentation/train.py
method: grid

metric:
  name: validation/css
  goal: maximize

parameters:
  backbone_learning_rate:
    value: 0.0000013649297100111978

  classifier_lr_multiplier:
    value: 20

  fl_class_weight:
    value: 1.990129625950856

  nf_class_weight:
    value: 1.0

  weight_decay:
    value: 0.05328805613626618

  batch_size:
    value: 64

  epochs:
    value: 80

  early_stopping_patience:
    value: 15

  early_stopping_min_delta:
    value: 0.001

  scheduler_patience:
    value: 5

  scheduler_factor:
    value: 0.3

  dropout:
    value: 0.0

  augmentation:
    value: one_augmented_copy_per_fl_random_affine

  random_seed:
    values:
      - 42
      - 123
      - 2026

command:
  - ${env}
  - ${interpreter}
  - ${program}
