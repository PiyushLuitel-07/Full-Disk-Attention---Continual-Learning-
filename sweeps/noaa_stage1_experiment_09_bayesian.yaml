name: noaa_stage1_experiment_09_bayesian
program: modeling/experiment_09_noaa_stage1_bayesian_tuning/train.py
method: bayes

# Each trial selects its checkpoint using chronological holdout CSS. The
# completed trial is ranked using the separate validation-period CSS.
metric:
  name: validation/css
  goal: maximize

parameters:
  # Partial imbalance correction. NF remains fixed at weight 1.0.
  fl_class_weight:
    distribution: uniform
    min: 1.0
    max: 2.2

  # Regularize convolutional and linear weights, excluding bias and norm.
  weight_decay:
    distribution: log_uniform_values
    min: 0.02
    max: 0.3

  # Fine-tune ImageNet features slowly.
  backbone_learning_rate:
    distribution: log_uniform_values
    min: 0.0000005
    max: 0.000003

  # Classifier LR is this multiplier times the sampled backbone LR.
  classifier_lr_multiplier:
    values:
      - 5
      - 10
      - 20

  nf_class_weight:
    value: 1.0

  batch_size:
    value: 64

  epochs:
    value: 80

  early_stopping_patience:
    value: 15

  early_stopping_min_delta:
    value: 0.001

  scheduler_patience:
    value: 5

  scheduler_factor:
    value: 0.3

  dropout:
    value: 0.0

  augmentation:
    value: none

  random_seed:
    value: 42

command:
  - ${env}
  - ${interpreter}
  - ${program}
