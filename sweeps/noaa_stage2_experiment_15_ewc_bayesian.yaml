name: noaa_stage2_experiment_15_ewc_bayesian
program: modeling/experiment_15_noaa_stage2_ewc_bayesian_tuning/train.py
method: bayes

# Each trial selects its epoch using Stage 2 holdout CSS. Bayesian tuning then
# ranks completed trials using the later validation-period CSS.
metric:
  name: validation/css
  goal: maximize

parameters:
  ewc_lambda:
    distribution: log_uniform_values
    min: 0.1
    max: 5000
  backbone_learning_rate:
    distribution: log_uniform_values
    min: 0.0000002
    max: 0.0000015
  classifier_lr_multiplier:
    values: [2, 5, 10, 20, 50]
  weight_decay:
    distribution: log_uniform_values
    min: 0.02
    max: 0.8
  label_smoothing:
    distribution: uniform
    min: 0.0
    max: 0.10
  # Stage 2 BatchNorm adaptation was the best controlled EWC-only ablation.
  # Keep it on in every tuning trial rather than mixing two protocols.
  adapt_batchnorm_running_stats: {value: true}
  nf_class_weight: {value: 1.0}
  # Small FL weights are tested, but extreme inverse-frequency weights are
  # excluded because they repeatedly produced excessive Stage 2 false alarms.
  fl_class_weight:
    values: [1.0, 1.15, 1.3, 1.5, 1.75, 2.0]
  # Larger batches use more GPU memory and fewer optimizer updates per epoch.
  # All values preserve the same original-image, EWC-only protocol.
  batch_size:
    values: [48, 64, 128]
  epochs: {value: 40}
  early_stopping_patience: {value: 10}
  scheduler_patience: {value: 3}
  random_seed: {value: 123}
  augmentation: {value: none}
  replay: {value: false}

command:
  - ${env}
  - ${interpreter}
  - ${program}
