name: noaa_stage1_mobilenet_bayesian
program: modeling/noaa_stage1/train.py
method: bayes

# Each trial selects its best epoch using holdout CSS, restores that
# checkpoint, and reports validation CSS once. The sweep ranks trials using
# the separate validation period; the test period remains untouched.
metric:
  name: validation/css
  goal: maximize

parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001

  weight_decay:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.1

  batch_size:
    values:
      - 64
      - 128

  dropout:
    value: 0.0

  augmentation:
    value: none

  trainable_backbone_blocks:
    value: 2

  epochs:
    value: 40

  early_stopping_patience:
    value: 10

  early_stopping_min_delta:
    value: 0.001

  random_seed:
    value: 42

command:
  - ${env}
  - ${interpreter}
  - ${program}
